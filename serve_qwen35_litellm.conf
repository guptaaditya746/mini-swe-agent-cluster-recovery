# Config for serve_qwen35_litellm.sh
# Keep all tunable values here. Keep launcher logic in the .sh file.

# -----------------------------
# Models
# -----------------------------
MODEL_CHAT='Qwen/Qwen3.5-4B'
MODEL_EMBED='Qwen/Qwen3-VL-Embedding-2B'

# -----------------------------
# LiteLLM / OpenAI-compatible aliases
# -----------------------------
CHAT_ALIAS='qwen-chat'
EMBED_ALIAS='qwen-embed'
VLLM_API_KEY=${LITELLM_API_KEY}

# -----------------------------
# Ports
# -----------------------------
PORT_CHAT='8000'
PORT_EMBED='8001'

# -----------------------------
# GPU placement
# Use the same GPU for both only if the memory budget fits.
# -----------------------------
GPU_CHAT='0'
GPU_EMBED='0'

# -----------------------------
# Context / memory
# -----------------------------
MAX_MODEL_LEN_CHAT='8192'
MAX_MODEL_LEN_EMBED='8192'
CHAT_GPU_MEMORY_UTILIZATION=0.85
EMBED_GPU_MEMORY_UTILIZATION=0.20

# -----------------------------
# Features / execution modes
# -----------------------------
START_EMBED=0
ENABLE_MTP='0'
ENFORCE_EAGER=1
LOG_LEVEL=info
WAIT_MAX=900
HEALTH_INTERVAL=5
PREFETCH_MODELS='1'

# -----------------------------
# Qwen3.5 reasoning / token saving
# vLLM expects valid JSON here. Do not add an extra }.
# This disables Qwen thinking output for denser GraphRAG responses.
# -----------------------------
REASONING_PARSER='qwen3'
CHAT_TEMPLATE_KWARGS='{"enable_thinking":false}'
SPECULATIVE_CONFIG='{"method":"mtp","num_speculative_tokens":1}'

# -----------------------------
# Tool Calling Configuration
# -----------------------------
ENABLE_AUTO_TOOL_CHOICE=1
TOOL_CALL_PARSER='qwen3_coder'

# -----------------------------
# Cache directories
# -----------------------------
HF_HOME="$HOME/.cache/huggingface"
TRANSFORMERS_CACHE="$HOME/.cache/huggingface/hub"
VLLM_CACHE_ROOT="$HOME/.cache/vllm"
TRITON_CACHE_DIR="$HOME/.cache/triton"
TORCHINDUCTOR_CACHE_DIR="$HOME/.cache/torch_inductor"

# -----------------------------
# Hugging Face / CPU runtime
# HF_HUB_ENABLE_HF_TRANSFER is deprecated in recent huggingface_hub.
# Use HF_XET_HIGH_PERFORMANCE instead.
# -----------------------------
HF_XET_HIGH_PERFORMANCE='1'
HF_HUB_OFFLINE='0'
OMP_NUM_THREADS='8'

# -----------------------------
# vLLM backend knobs
# -----------------------------
VLLM_USE_FLASHINFER_SAMPLER='0'

# -----------------------------
# Logs
# Keep empty or set to a path. Default in script is the script directory.
# -----------------------------
# LOG_DIR='/path/to/logs'
